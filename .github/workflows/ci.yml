name: CI

on:
  push:
    branches: [main, next]
  pull_request:
    branches: [main, next]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: verify (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ['22', '24', '26']
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v6
        with:
          run_install: false

      - uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Lint (Biome)
        run: pnpm lint

      - name: Type-check
        run: pnpm type-check

      # Build first: CLI e2e tests (help-compat, schema, mcp-smoke) run against dist/.
      - name: Build
        run: pnpm build

      - name: Test
        run: pnpm test

      - name: Skill packages lint
        run: pnpm verify:skills

      - name: Verify built bin executes
        run: node dist/index.js --version

      - name: "Startup budget (spec: --help < 150ms)"
        if: matrix.node == '24'
        # Shared runners are noisy: 2x headroom still catches an eager SDK import (~+300ms).
        run: GACLI_STARTUP_BUDGET=1 GACLI_STARTUP_BUDGET_SCALE=2 pnpm vitest run test/startup/budget.test.ts

      - name: Packed install smoke test
        if: matrix.node == '24'
        run: ./scripts/pack-smoke.sh
